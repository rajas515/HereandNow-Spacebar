<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1d4a"><meta name="description" content="In the life of — an overhead studio, rendered as a living paper study.">
<title>In the life of — Green hour</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header><a href="../" aria-label="Return to the scene map">green hour <span>↗</span></a><span class="edition">SCENE STUDY / 03</span></header>
<main>
<div class="heading"><h1>in the life of</h1><span>a room, in the middle of things.</span></div>
<div id="stage"><canvas id="scene" tabindex="0" aria-label="Overhead view of a busy design studio. Move the pointer for gentle parallax."></canvas><div id="loading" role="status">unfolding the studio<span>· · ·</span></div><p id="error" role="alert" hidden>The studio could not load. <button id="retry">Try again</button></p></div>
<footer><span class="caption">01 / THE STUDIO</span><nav aria-label="Scene controls"><button id="wide" aria-pressed="true" aria-label="Wide studio view">Room</button><button id="table-view" aria-pressed="false" aria-label="Table close-up">Table</button><i></i><button id="print" aria-pressed="true">Print</button><button id="material" aria-pressed="false">Original</button><i></i><button id="motion" aria-pressed="false" aria-label="Pause scene motion">Pause</button><button id="settings" aria-expanded="false" aria-controls="controls">Adjust <span>＋</span></button></nav></footer>
<section id="controls" aria-label="Scene adjustments" hidden><label>Ink texture<input id="riso" type="range" min="0" max="1" step=".01" value=".7"></label><label>Drawing<input id="sketch" type="range" min="0" max="1" step=".01" value=".5"></label><label>Light<input id="exposure" type="range" min="-2" max="2" step=".01" value="0"></label><label>Fisheye<input id="lens" type="range" min="0" max="1.2" step=".01" value=".45" title="0 is unwarped; increase for barrel distortion"></label><label>Width<input id="width" type="range" min=".9" max="1.3" step=".01" value="1.12"></label><label>Quality<select id="quality"><option value="balanced">Balanced</option><option value="high">Fine</option><option value="low">Light</option></select></label><button id="reset">Reset study</button><output id="metrics"></output></section>
</main>
<script type="module" src="./scene.js"></script>
</body></html>
