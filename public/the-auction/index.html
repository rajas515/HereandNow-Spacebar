<style>
*{box-sizing:border-box}body{margin:0;background:#1a1d4a;color:#e5d1ea;font:13px system-ui,sans-serif}header,main{width:min(1300px,96vw,max(510px,calc((100svh - 152px) * 2.06)));margin:auto}header{padding:14px 0}a{color:inherit}h1{font:clamp(32px,5vw,64px) Georgia;margin:0}footer{display:flex;justify-content:space-between;align-items:center;padding:8px 0 24px}
#stage{position:relative;aspect-ratio:2.06;overflow:hidden;container-type:size;background:#191b43;outline:none}
#status{position:absolute;inset:45% 0 auto;text-align:center;pointer-events:none;margin:0}
#frame{position:absolute;left:50%;top:50%;width:0;height:0}
#auction-stage{position:absolute;width:1200px;height:800px;left:-600px;top:-400px;perspective:1050px}
#world,#front-world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
#front-world{z-index:1}
.plane{position:absolute;inset:0 auto auto 0;transform-origin:center;cursor:pointer}
.plane>img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
/* Lots rest see-through and come to full colour on hover or when opened (no dark shade). */
.art{inset:0;width:100%;height:100%;opacity:.4;transition:opacity 240ms ease}
.highlight>.art,.selected>.art{opacity:1}
.outline{visibility:hidden}
.selected>.outline{visibility:visible}
#stage,#focus-item{user-select:none;-webkit-user-select:none}
#focus-item{position:absolute;z-index:4;top:9%;right:10%;width:var(--card-scene-width,477px);aspect-ratio:694.5/474.5;pointer-events:none;transform:translate(var(--card-x,0cqw),var(--card-y,0cqh)) scale(var(--card-scale,1));transform-origin:top right}
#focus-item[hidden]{display:none}
#focus-item svg{display:block;width:100%;height:auto;pointer-events:none}
#focus-item svg path,#focus-item svg image,#focus-item svg text{pointer-events:visiblePainted;cursor:pointer}
#bid-form{pointer-events:auto;font:12.745px Mulish,Arial,sans-serif;color:#171944}
#bid-form input{box-sizing:border-box;display:block;width:242px;height:22px;border:1px solid #842478;background:#ffdef8;color:#171944;padding:2px 4px;font:inherit;border-radius:0}
#bid-form button{display:block;margin-top:9px;width:109px;height:34px;border:0;border-radius:0;background:#ff54c2;color:#171944;cursor:pointer;font:18.207px Mulish,Arial,sans-serif}
#bid-form button:hover,#bid-form button:focus-visible{background:#f987de;outline:2px solid #842478}
#bid-status{padding-top:4px;line-height:1.2}
@media(prefers-reduced-motion:reduce){.art{transition:none}}
/* Embedded (exhibition world or map): the stage fills the frame, page chrome hidden. */
.map-embedded body{background:transparent;overflow:hidden}.map-embedded header,.map-embedded h1,.map-embedded footer{display:none}.map-embedded main{width:100vw;height:100vh}.map-embedded #stage{aspect-ratio:auto;height:100%;background:transparent}
